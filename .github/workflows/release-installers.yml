name: Publish installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Verify version and release files
        id: release_files
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${tag}" != "v${version}" ]]; then
            echo "Tag ${tag} does not match VERSION ${version}." >&2
            exit 1
          fi
          assets=(
            "ClassInterpreter-Setup-Windows.bat"
            "ClassInterpreter-Setup-Mac.zip"
            "ClassInterpreter-windows-${version}.zip"
            "ClassInterpreter-mac-${version}.zip"
            "ClassInterpreter-recover-${version}.zip"
          )
          for asset in "${assets[@]}"; do
            [[ -s "${asset}" ]] || { echo "Missing release asset: ${asset}" >&2; exit 1; }
          done
          printf '%s\n' "${assets[@]}" > release-assets.txt
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release_files.outputs.version }}"
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            tag="v${version}"
          fi
          mapfile -t assets < release-assets.txt
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${assets[@]}" --clobber
          else
            gh release create "${tag}" "${assets[@]}" \
              --title "Class Interpreter ${version}" \
              --generate-notes \
              --latest
          fi
